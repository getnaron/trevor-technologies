<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - Trevor Technologies</title>
    <link href="config.yml" type="text/yaml" rel="cms-config-url">
    <style>
      /* Customize Decap CMS Login Button & Accents */
      [class*="Button-button-default-zIndex-disabled-lightBlue"] {
        background-color: #00AEEF !important;
        color: white !important;
      }
      [class*="AppHeader-header"] {
        background-color: #00AEEF !important;
      }
      [class*="AppHeader-button"] {
        color: white !important;
      }
      /* Top Header Logo Size */
      [class*="AppHeader-header"] img {
        max-height: 40px !important;
        background: white;
        padding: 4px 8px;
        border-radius: 4px;
      }
      /* Login Screen Logo */
      [class*="Login-LoginButtonContainer"] img {
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        // Force a clean redirect to the login screen when logging out
        window.netlifyIdentity.on("logout", () => {
          document.location.href = "/admin/";
        });
        
        // Listen to init. If the user is NOT logged in initially, register the login handler to reload the page on successful authentication.
        // If the user IS already logged in, do not register the reload handler to prevent an infinite reload loop.
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.reload();
            });
          }
        });
      }
    </script>
  </body>
</html>
